# Xcode project definition. Generate the project with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is not committed.
name: SteadyStrength
options:
  bundleIdPrefix: au.com.rwfitness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-AU
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SteadyCore:
    path: Packages/SteadyCore
targets:
  SteadyStrength:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Generated
        buildPhase: resources
        excludes: ["*.md"]
      - path: Resources/Restaurants
        buildPhase: resources
      - path: Resources/Foods
        buildPhase: resources
    dependencies:
      - package: SteadyCore
      - target: RestTimerWidget
    entitlements:
      path: Config/SteadyStrength.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Widgets need this app group, created once on developer.apple.com (Identifiers > App Groups) and added to both
        # App IDs. Xcode can't create it with an upload key, so it stays off until that is done:
        # com.apple.security.application-groups: [group.au.com.rwfitness.steadystrength]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Steady Strength
        CFBundleURLTypes:
          - CFBundleURLName: au.com.rwfitness.steadystrength
            CFBundleURLSchemes: [steadystrength]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Plum
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Steady Strength uses the camera to scan food barcodes and read nutrition labels (on your phone, the photo is not kept) and, if you choose, to photograph your plate or take progress photos that stay in the app.
        NSHealthUpdateUsageDescription: If you switch it on in Settings, Steady Strength saves each finished workout to Apple Health as strength training (start and end time). Nothing else is written.
        NSHealthShareUsageDescription: Steady Strength reads your steps, workouts, active energy, sleep and body weight from Apple Health to fill in your weekly check-in and show your week. Nothing is shared.
        NSFaceIDUsageDescription: Steady Strength uses Face ID to keep your health and training data private on this iPhone.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        HideUnreviewedContent: false
        NutritionCatalogueURL: $(NUTRITION_CATALOGUE_URL)
        PlateRelayURL: $(PLATE_RELAY_URL)
        PlateRelayToken: $(PLATE_RELAY_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  RestTimerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RestTimerWidget
      - path: Shared
    info:
      path: Config/RestTimerWidget-Info.plist
      properties:
        CFBundleDisplayName: Steady Strength Rest Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength.resttimer
        # iOS 18 adds the Apple Watch layout. On iOS 17 the app still runs; only the lock-screen timer is missing.
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SteadyStrengthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SteadyStrength
      - package: SteadyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength.tests
  SteadyStrengthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: SteadyStrength
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength.uitests
schemes:
  SteadyStrength:
    build:
      targets:
        SteadyStrength: all
    test:
      targets:
        - SteadyStrengthTests
        - SteadyStrengthUITests
      gatherCoverageData: true
